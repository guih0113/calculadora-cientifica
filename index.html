<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Científica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>
  <div class="calculator">
    <div class="display-container">
      <input type="text" id="display" value="0" disabled>
    </div>

    <div class="scientific-row">
      <button data-value="sin">sin</button>
      <button data-value="cos">cos</button>
      <button data-value="tan">tan</button>
      <button data-value="ln">ln</button>
      <button data-value="e^x">e^x</button>
    </div>

    <div class="scientific-row">
      <button data-value="cot">cot</button>
      <button data-value="sec">sec</button>
      <button data-value="csc">csc</button>
      <button data-value="root">y√x</button>
      <button data-value="^">x^y</button>
    </div>

    <div class="buttons">
      <button class="function" data-value="C">C</button>
      <button class="function" data-value="+/-">+/-</button>
      <button class="function" data-value="%">%</button>
      <button class="operator" data-value="/">/</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="zero" data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="operator" data-value="=">=</button>
    </div>
  </div>
</body>

</html>
