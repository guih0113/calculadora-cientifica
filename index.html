<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Científica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>
  <div class="calculator">
    <div class="display-container">
      <input type="text" id="display" value="0" disabled>
    </div>

    <div class="mode-toggle">
      <button id="degBtn" class="mode-btn active" data-mode="deg">DEG</button>
      <button id="radBtn" class="mode-btn" data-mode="rad">RAD</button>
    </div>

    <div class="scientific-row">
      <button data-value="sin">sin</button>
      <button data-value="cos">cos</button>
      <button data-value="tan">tan</button>
      <button data-value="ln">ln</button>
      <button data-value="e^x">e^x</button>
    </div>

    <div class="scientific-row">
      <button data-value="cot">cot</button>
      <button data-value="sec">sec</button>
      <button data-value="csc">csc</button>
      <button data-value="root">y√x</button>
      <button data-value="^">x^y</button>
    </div>

    <div class="buttons">
      <button class="function" data-value="C">C</button>
      <button class="function" data-value="+/-">+/-</button>
      <button class="function" data-value="%">%</button>
      <button class="operator" data-value="/">/</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="zero" data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="operator" data-value="=">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    const buttons = document.querySelectorAll('button');
    const degBtn = document.getElementById('degBtn');
    const radBtn = document.getElementById('radBtn');

    let expression = '';
    let lastResult = null;
    let angleMode = 'deg';

    buttons.forEach(button => {
      button.addEventListener('click', () => {
        const value = button.dataset.value;

        if (value === 'C') {
          expression = '';
          lastResult = null;
          updateDisplay();
        } else if (value === '=') {
          calculateResult();
        } else if (value === '+/-') {
          toggleSign();
        } else if (value === '%') {
          applyPercentage();
        } else if (isScientificOperator(value)) {
          handleScientific(value);
        } else {
          if (lastResult !== null && !isOperator(value)) {
            expression = '';
            lastResult = null;
          }
          expression += value;
          updateDisplay();
        }
      });
    });

    degBtn.addEventListener('click', () => {
      angleMode = 'deg';
      degBtn.classList.add('active');
      radBtn.classList.remove('active');
    });

    radBtn.addEventListener('click', () => {
      angleMode = 'rad';
      radBtn.classList.add('active');
      degBtn.classList.remove('active');
    });

    function isOperator(value) {
      return ['+', '-', '*', '/', '^'].includes(value);
    }

    function isScientificOperator(value) {
      return ['sin', 'cos', 'tan', 'cot', 'sec', 'csc', 'e^x', 'ln', 'root'].includes(value);
    }

    function toggleSign() {
      if (expression) {
        const num = parseFloat(expression);
        if (!isNaN(num)) {
          expression = (num * -1).toString();
          updateDisplay();
        }
      }
    }

    function applyPercentage() {
      if (expression) {
        const num = parseFloat(expression);
        if (!isNaN(num)) {
          expression = (num / 100).toString();
          updateDisplay();
        }
      }
    }

    function handleScientific(value) {
      try {
        if (value === 'root') {
          expression += 'root';
          updateDisplay();
          return;
        }

        let currentValue = expression || lastResult?.toString() || '0';
        const lastNumberMatch = currentValue.match(/(\d+\.?\d*|\d*\.?\d+)$/);
        
        if (lastNumberMatch) {
          const lastNumber = lastNumberMatch[0];
          let operand = parseFloat(lastNumber);
          let result = 0;

          const isTrigonometric = ['sin', 'cos', 'tan', 'cot', 'sec', 'csc'].includes(value);
          
          // Converte para radianos se o modo for DEG
          let angle = operand;
          if (isTrigonometric) {
            angle = angleMode === 'deg' ? (operand * Math.PI) / 180 : operand;
          }

          switch (value) {
            case 'sin':
              result = Math.sin(angle);
              break;
            case 'cos':
              result = Math.cos(angle);
              break;
            case 'tan':
              result = Math.tan(angle);
              break;
            case 'cot':
              result = 1 / Math.tan(angle);
              break;
            case 'sec':
              result = 1 / Math.cos(angle);
              break;
            case 'csc':
              result = 1 / Math.sin(angle);
              break;
            case 'e^x':
              result = Math.exp(operand);
              break;
            case 'ln':
              result = Math.log(operand);
              break;
          }
          
          expression = currentValue.slice(0, -lastNumber.length) + result.toString();
          lastResult = result;
          updateDisplay();
        }
      } catch (error) {
        expression = 'Erro';
        updateDisplay();
      }
    }
    function calculateResult() {
      try {
        let evalExpression = expression;
        if (evalExpression.includes('root')) {
          const parts = evalExpression.split('root');
          const index = parseFloat(parts[0]);
          const radicand = parseFloat(parts[1]);
          if (!isNaN(index) && !isNaN(radicand)) {
            evalExpression = Math.pow(radicand, 1 / index).toString();
          } else {
            throw new Error('Invalid root expression');
          }
        }

        evalExpression = evalExpression.replace(/\^/g, '**');
        const result = eval(evalExpression);
        expression = result.toString();
        lastResult = result;
        updateDisplay();
      } catch (error) {
        expression = 'Erro';
        updateDisplay();
      }
    }

    function updateDisplay() {
      display.value = expression || '0';
    }
  </script>
</body>

</html>
